databases:
  - name: jagadeesh-kitchen-db
    databaseName: jagadeesh_kitchen
    user: jagadeesh_kitchen
    plan: basic-1gb

services:
  - type: web
    name: jagadeesh-kitchen
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn Resturant_Project.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: jagadeesh-kitchen-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
